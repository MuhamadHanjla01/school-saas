services:
  - type: web
    name: erpzo-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erpzo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: erpzo-db
    plan: free
